<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Downloader</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com/"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-600 dark:text-neutral-400 antialiased selection:bg-[#ff005e]/30 selection:text-[#ff005e] overflow-x-hidden transition-colors duration-300">

  <!-- Noise Overlay -->
  <div class="noise z-50"></div>

  <!-- Gradient Swirl Backgrounds -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="gradient-swirl gradient-swirl-1 swirl-pos-1"></div>
    <div class="gradient-swirl gradient-swirl-2 swirl-pos-2"></div>
    <div class="gradient-swirl gradient-swirl-3 swirl-pos-3"></div>
  </div>

  <!-- Grid Pattern Overlay -->
  <div class="fixed inset-0 z-0 pointer-events-none grid-pattern opacity-50"></div>

  <!-- Header -->
  <header class="relative z-10 border-b border-neutral-200 dark:border-white/5 bg-white/80 dark:bg-neutral-950/80 backdrop-blur-md transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 md:px-6 h-16 flex items-center gap-2 sm:gap-3">
      <span class="flex items-center gap-2 text-neutral-900 dark:text-white font-medium tracking-tight text-base sm:text-lg text-transition shrink-0 min-w-0">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="20" height="20" viewBox="0 0 24 24" class="iconify iconify--lucide shrink-0"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m22 8-6 4 6 4V8Z"></path><rect width="14" height="12" x="2" y="6" rx="2" ry="2"></rect></g></svg>
        <span class="truncate">YT Downloader</span>
        <span class="hidden min-[420px:inline-flex] text-[10px] uppercase tracking-widest font-bold text-[#ff005e] border border-[#ff005e]/20 bg-[#ff005e]/5 px-1.5 py-0.5 rounded whitespace-nowrap">MP3 · MP4</span>
      </span>
      <div class="flex-1"></div>
      <button id="theme-toggle" class="theme-toggle shrink-0" aria-label="Alternar tema">
        <div class="theme-toggle-thumb">
          <span class="iconify" data-icon="lucide:moon" data-width="14"></span>
        </div>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="relative z-10">
    <section class="relative overflow-hidden px-4 md:px-6 pt-6 sm:pt-10 pb-10 md:pt-16 md:pb-16">
      <div class="max-w-6xl mx-auto">
        <div id="hero" class="min-h-[calc(100vh-4rem)] flex flex-col justify-center transition-all duration-500">
          <div class="boxed-container relative p-5 sm:p-8 md:p-16">
            <div class="extended-border-top animate-extend-h"></div>
            <div class="extended-border-bottom animate-extend-h anim-delay-300"></div>
            <div class="extended-border-left animate-extend-v anim-delay-150"></div>
            <div class="extended-border-right animate-extend-v anim-delay-450"></div>
            <div class="corner-accent corner-tl"></div>
            <div class="corner-accent corner-tr"></div>
            <div class="corner-accent corner-bl"></div>
            <div class="corner-accent corner-br"></div>
            <div class="beam-runner beam-top"></div>

        <div class="text-center relative z-10">
          <div class="inline-flex max-w-full items-center justify-center gap-2 px-3 py-1 rounded-full border border-[#ff005e]/20 bg-[#ff005e]/5 text-[11px] sm:text-xs font-medium text-[#ff005e] mb-6 sm:mb-8 fade-in-up tracing-beam text-center">
            <span class="relative flex h-2 w-2 shrink-0">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#ff005e] opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-[#ff005e]"></span>
            </span>
            <span class="min-w-0">YouTube downloader • MP3 · MP4</span>
          </div>

          <h1 class="text-4xl sm:text-5xl md:text-7xl font-medium text-neutral-900 dark:text-white tracking-tighter mb-6 leading-[1.1] fade-in-up delay-100 text-balance break-words">
            <span class="text-transition hover:text-[#ff005e] cursor-default">Baixe</span>
            <span class="text-transition hover:text-purple-500 dark:hover:text-purple-400 cursor-default">vídeos</span>
            <br>
            <span class="text-transparent bg-clip-text bg-gradient-to-br from-neutral-900 dark:from-white via-neutral-600 dark:via-neutral-200 to-neutral-400 dark:to-neutral-500 animate-shine">e músicas.</span>
          </h1>

          <p class="text-base sm:text-lg md:text-xl text-neutral-600 dark:text-neutral-400 max-w-2xl mx-auto mb-8 sm:mb-10 leading-relaxed fade-in-up delay-200 px-1">Cole o link do YouTube, veja as informações e escolha o formato ideal</p>

          <div class="flex flex-col md:flex-row gap-2 max-w-2xl mx-auto fade-in-up delay-300">
            <input id="url-input" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://www.youtube.com/watch?v=..." aria-label="Link do YouTube" class="w-full md:flex-1 min-w-0 h-12 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-full px-6 text-base md:text-sm text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-600 focus:outline-none focus:ring-1 focus:ring-[#ff005e] transition-all">
            <button id="fetch-btn" class="w-full md:w-auto h-12 px-8 rounded-full bg-neutral-900 dark:bg-white text-white dark:text-black font-medium hover:bg-neutral-700 dark:hover:bg-neutral-200 transition-all flex items-center justify-center gap-2 tracing-beam shrink-0">Buscar</button>
          </div>
          <p id="status" class="text-sm mt-3"></p>
        </div>
      </div>
        </div>
      </div>
    </section>

    <section id="result" class="relative overflow-hidden px-4 md:px-6 pt-6 pb-10 md:pb-16 hidden">
      <div class="max-w-6xl mx-auto">
        <div class="boxed-container relative">
          <div class="corner-accent corner-tl"></div>
          <div class="corner-accent corner-tr"></div>
          <div class="corner-accent corner-bl"></div>
          <div class="corner-accent corner-br"></div>
    <div class="card-glow rounded-2xl border border-neutral-200 dark:border-white/10 bg-white/80 dark:bg-neutral-900/80 backdrop-blur p-4 sm:p-5 md:p-8">
      <img id="thumb" class="rounded-xl w-full aspect-video object-cover h-auto" alt="" loading="lazy">
      <h2 id="title" class="text-lg sm:text-xl font-semibold tracking-tight mt-4 text-neutral-900 dark:text-white break-words"></h2>
      <div id="meta" class="mt-3 flex flex-wrap gap-2"></div>

      <div class="space-y-1.5 mt-4">
        <label for="type-select" class="text-xs font-medium text-neutral-700 dark:text-neutral-300">Tipo</label>
        <div class="relative">
          <select id="type-select" class="w-full bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-lg px-3 py-3 sm:py-2 text-base sm:text-sm text-neutral-900 dark:text-white appearance-none focus:outline-none focus:ring-1 focus:ring-[#ff005e]">
            <option value="video">Vídeo</option>
            <option value="audio">Áudio (MP3)</option>
          </select>
          <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="14" height="14" viewBox="0 0 24 24" class="iconify absolute right-3 top-2.5 text-neutral-500 pointer-events-none iconify--lucide"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9l6 6l6-6"></path></svg>
        </div>
      </div>
      <div class="space-y-1.5 mt-4">
        <label for="quality-select" class="text-xs font-medium text-neutral-700 dark:text-neutral-300">Qualidade</label>
        <div class="relative">
          <select id="quality-select" class="w-full bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-lg px-3 py-3 sm:py-2 text-base sm:text-sm text-neutral-900 dark:text-white appearance-none focus:outline-none focus:ring-1 focus:ring-[#ff005e]">
          </select>
          <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="14" height="14" viewBox="0 0 24 24" class="iconify absolute right-3 top-2.5 text-neutral-500 pointer-events-none iconify--lucide"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9l6 6l6-6"></path></svg>
        </div>
      </div>
      <button id="download-btn" class="w-full min-h-[48px] py-3 sm:py-2.5 rounded-lg bg-neutral-900 dark:bg-white text-white dark:text-black font-semibold hover:bg-neutral-700 dark:hover:bg-neutral-200 transition-colors text-base sm:text-sm mt-4">Download</button>
    </div>
          <div class="extended-border-top animate-extend-h"></div>
          <div class="extended-border-bottom animate-extend-h anim-delay-300"></div>
          <div class="extended-border-left animate-extend-v anim-delay-150"></div>
          <div class="extended-border-right animate-extend-v anim-delay-450"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
  <script>
    // Theme Toggle Function
    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        updateToggleIcon('light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        updateToggleIcon('dark');
      }
    }

    function updateToggleIcon(theme) {
      const iconElements = document.querySelectorAll('.theme-toggle-thumb .iconify');
      iconElements.forEach((iconElement) => {
        if (theme === 'dark') {
          iconElement.setAttribute('data-icon', 'lucide:moon');
        } else {
          iconElement.setAttribute('data-icon', 'lucide:sun');
        }
      });
    }

    // Check for saved theme preference or default to dark
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || !savedTheme) {
        document.documentElement.classList.add('dark');
        updateToggleIcon('dark');
      } else {
        document.documentElement.classList.remove('dark');
        updateToggleIcon('light');
      }
    }

    initTheme();
    document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  </script>
</body>
</html>
