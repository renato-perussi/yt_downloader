[project]
name = "yt-downloader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn[standard]==0.54.0", "yt-dlp==2026.10.26"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff >= 0.14 formats Python code blocks inside Markdown; this project lints
# Python sources only, so docs/*.md are kept out of the lint/format scope.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
